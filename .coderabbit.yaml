# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Reviews are rate-limited, so CodeRabbit reviews a PR once, when it leaves
# draft, on any base branch (stacked PRs included). Pushes don't re-trigger a
# review; request the follow-up with `@coderabbitai review` after the fixes.
language: en-US
reviews:
  profile: chill
  # Don't post "Review skipped" status comments on every push.
  review_status: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false
    base_branches: [".*"]
