# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews a PR once, when it leaves draft (about 10 reviews per
# hour on the current plan). Pushes don't re-trigger a review; follow-up
# reviews are done by the local reviewer (`bun run review <pr>`). Markdown is excluded: documentation-only PRs need
# no AI review (CONTRIBUTING.md#review-gate).
language: en-US
reviews:
  profile: chill
  path_filters:
    - "!**/*.md"
  # Don't post "Review skipped" status comments on every push.
  review_status: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false
    base_branches: [".*"]
