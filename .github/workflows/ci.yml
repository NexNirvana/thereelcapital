name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Jobs run on GitHub-hosted runners (free and unlimited for this public repo).
# Set the repository variable CI_RUNNER (e.g. a Blacksmith label) to move them.

jobs:
  check:
    name: check
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run check

  lint:
    name: lint
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run lint

  unit:
    name: unit
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run test:unit

  engine:
    name: engine
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run test:engine

  e2e:
    name: e2e
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - id: playwright
        run: echo "version=$(bunx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Browsers come from the cache when present; the system packages are always installed.
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run build
      # The web Worker's generated types reference the build output, so this runs after it.
      - run: bun run types:check
      # Prove both Workers bundle, without credentials.
      - run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/engine-dist" -c engine/wrangler.jsonc
      - run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/web-dist" -c wrangler.jsonc

  deploy:
    name: deploy
    needs: [check, lint, unit, engine, e2e, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    # The token is passed only to the Wrangler steps, never to the dependency install.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run build
      - run: bunx wrangler d1 migrations apply DB --remote
        env: &cloudflare
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Engine first: the web Worker's ENGINE binding points at it.
      - run: bunx wrangler deploy -c engine/wrangler.jsonc
        env: *cloudflare
      - run: bunx wrangler deploy -c wrangler.jsonc
        env: *cloudflare
      # The custom domain can take a moment to serve the new Worker.
      - name: Smoke check
        run: |
          for attempt in $(seq 1 12); do
            status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' https://thereelcapital.com/acceso) \
              && [ "$status" = 200 ] && exit 0
            echo "attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          echo "thereelcapital.com did not serve the access page" >&2
          exit 1
