name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Jobs run on GitHub-hosted runners (free and unlimited for this public repo).
# The repository variable CI_RUNNER holds a JSON runner label, e.g. ["self-hosted","reel-local"],
# and moves every job except `deploy` there. Fork pull requests always use GitHub-hosted runners,
# and `deploy` (the only job with secrets) always runs on ubuntu-24.04.

jobs:
  check:
    name: check
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run check

  lint:
    name: lint
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run lint

  unit:
    name: unit
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run test:unit

  engine:
    name: engine
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run test:engine

  # Each shard runs on its own runner with its own local D1 state, so the single worker per
  # shard never contends for the database lock.
  e2e-shard:
    name: e2e-shard (${{ matrix.shard }})
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || '"ubuntu-24.04"') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - id: playwright
        run: echo "version=$(bunx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Browsers come from the cache when present. GitHub-hosted runners also need the system
      # packages; a self-hosted runner has them installed already (and no sudo).
      - if: runner.environment == 'github-hosted'
        run: bunx playwright install --with-deps chromium
      - if: runner.environment != 'github-hosted'
        run: bunx playwright install chromium
      - run: bun run test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
      # A reused runner must not keep local D1 state or reports from this run.
      - if: ${{ always() }}
        run: rm -rf .wrangler blob-report test-results playwright-report

  # The required status check: one `e2e` result for the whole sharded run.
  e2e:
    name: e2e
    needs: [e2e-shard]
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/setup
      - if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - if: ${{ !cancelled() }}
        run: bunx playwright merge-reports --reporter html ./all-blob-reports
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # Fails the required check when any shard failed or was skipped.
      - if: ${{ !cancelled() }}
        run: test "${{ needs.e2e-shard.result }}" = success

  build:
    name: build
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run build
      # The web Worker's generated types reference the build output, so this runs after it.
      - run: bun run types:check
      # Prove both Workers bundle, without credentials.
      - run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/engine-dist" -c engine/wrangler.jsonc
      - run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/web-dist" -c wrangler.jsonc

  deploy:
    name: deploy
    needs: [check, lint, unit, engine, e2e, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    # The token is passed only to the Wrangler steps, never to the dependency install.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run build
      - run: bunx wrangler d1 migrations apply DB --remote
        env: &cloudflare
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Engine first: the web Worker's ENGINE binding points at it.
      - run: bunx wrangler deploy -c engine/wrangler.jsonc
        env: *cloudflare
      - run: bunx wrangler deploy -c wrangler.jsonc
        env: *cloudflare
      # The custom domain can take a moment to serve the new Worker.
      - name: Smoke check
        run: |
          for attempt in $(seq 1 12); do
            body=$(curl -fsS --max-time 10 https://thereelcapital.com/acceso) \
              && grep -q 'Entrar con passkey' <<<"$body" && exit 0
            echo "attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          echo "thereelcapital.com did not serve the sign-in page" >&2
          exit 1
